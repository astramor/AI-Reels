# llm_model: "qwen2.5:14b-instruct-q6_K"
# gemini_api_key: ""
# gemini_model: "gemini-2.5-pro"
# ==============================================================================
# [TEST END: DEEPSEEK COLAB (OPENAI-API)]
# ==============================================================================

# --- Viral Style ---
color_grade: true
music_dir: "music"
music_volume: 0.08       

# --- Audio Ducking ---
ducking_threshold: 0.08 
ducking_ratio: 5.0       
ducking_attack: 50       
ducking_release: 1200    

# --- Workflow Einstellungen ---
confirm_spans: true      
confirm_subtitles: true
